services:
  - type: web
    name: me-admin-portal
    runtime: node
    region: singapore   # closest to Thailand / SEA
    plan: starter       # persistent disk requires Starter plan or above

    # Build phase: npm ci installs devDeps (tsx) needed for migrations at start.
    # The persistent disk is NOT yet mounted here — only compile the app.
    # rm -rf .next forces a clean webpack build (avoids stale module-resolution cache).
    buildCommand: npm ci --include=dev && rm -rf .next && npm run build

    # Start phase: disk is mounted, DB_PATH points to the persistent volume.
    # mkdir -p ensures /data exists before migrations try to open the DB file.
    # Migrations are idempotent (IF NOT EXISTS / INSERT OR IGNORE) — safe on every deploy.
    startCommand: mkdir -p /data && npm run db:push && npm run db:seed:frameworks && npm start

    # Persistent disk — SQLite database + uploaded evidence files
    disk:
      name: me-admin-data
      mountPath: /data
      sizeGB: 1   # upgrade as needed

    envVars:
      - key: NODE_ENV
        value: production

      # Tell the app where to find (or create) the SQLite database file.
      # Must match the disk mountPath above.
      - key: DB_PATH
        value: /data/app.db

      # JWT secret for session signing — Render auto-generates a secure value.
      - key: JWT_SECRET
        generateValue: true

    # Liveness check — returns { status: "ok" } with no sensitive info (A05)
    healthCheckPath: /api/health

    autoDeploy: false   # set true to deploy automatically on every push to main
